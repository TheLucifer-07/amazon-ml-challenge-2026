project:
  name: "amazon-ml-challenge-2026-entity-resolution"
  random_seed: 42
  debug: false
  sample_size: null  # set to integer for fast exploratory runs

paths:
  raw_train_dir: "dataset/train"
  raw_test_dir: "dataset/test"
  interim_dir: "data/interim"
  processed_dir: "data/processed"
  candidates_dir: "data/candidates"
  models_dir: "artifacts/models"
  preprocessors_dir: "artifacts/preprocessors"
  schemas_dir: "artifacts/schemas"
  thresholds_dir: "artifacts/thresholds"
  reports_dir: "artifacts/reports"
  outputs_dir: "outputs"
  final_matching_file: "outputs/matching_results.tsv"
  final_candidate_file: "outputs/candidate_pairs.tsv"

data:
  separator: "\t"
  encoding: "utf-8"
  canonical_columns:
    - "entity_id"
    - "business_name"
    - "business_address"
    - "country"

preprocessing:
  normalize_unicode: true
  lowercase: true
  clean_punctuation: true
  normalize_whitespace: true
  expand_legal_abbreviations: true
  expand_address_abbreviations: true
  canonical_countries:
    - "us"
    - "india"
    - "france"

blocking:
  max_candidates_per_entity: 100
  min_token_length: 3
  passes:
    exact_name: true
    exact_name_clean: true
    name_token_inverted_index: true
    name_prefix_3: true
    address_token_overlap: true
    geo_token_overlap: true

features:
  use_exact_match: true
  use_jaro_winkler: true
  use_levenshtein: true
  use_jaccard: true
  use_token_features: true
  use_tfidf: true
  use_address_features: true
  use_country_features: true
  use_missing_features: true
  use_length_features: true
  tfidf:
    word_ngram_range: [1, 2]
    char_ngram_range: [2, 5]
    max_features: 10000

model:
  type: "lightgbm"  # "xgboost" or "lightgbm"
  n_estimators: 300
  learning_rate: 0.05
  max_depth: 6
  num_leaves: 63
  subsample: 0.8
  colsample_bytree: 0.8
  scale_pos_weight: 1.0
  n_jobs: -1

evaluation:
  metric: "f0.5"
  beta: 0.5
  val_size: 0.2
  split_strategy: "group_shuffle"  # group by source1_entity_id to prevent leakage

threshold:
  start: 0.05
  end: 0.95
  step: 0.01
  default: 0.50
